version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://archai:archai_secure_pass@db:5432/archai
      - REDIS_URL=redis://redis:6379/0
      - DEMO_MODE=true
      - SECRET_KEY=archai-super-secret-key-production-change-me
      - CORS_ORIGINS=["http://localhost:3000", "http://127.0.0.1:3000", "http://web:3000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: python -m app.workers.orchestrator_worker
    environment:
      - DATABASE_URL=postgresql://archai:archai_secure_pass@db:5432/archai
      - REDIS_URL=redis://redis:6379/0
      - DEMO_MODE=true
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=archai
      - POSTGRES_PASSWORD=archai_secure_pass
      - POSTGRES_DB=archai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archai -d archai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
